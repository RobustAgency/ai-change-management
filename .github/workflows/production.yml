name: Production Deployment
on:
  push:
    branches:
      - main
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://api.innovative-dialogs.com
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Laravel Envoy
        uses: php-actions/composer@v6
        with:
          args: --ignore-platform-reqs
          command: require laravel/envoy --dev

      - name: Adding server key
        run: |
          echo "${{ secrets.PROD_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "3.227.157.199" > ~/.ssh/known_hosts

      - name: Deploying to server
        run: ./vendor/bin/envoy run deploy --env=production
